<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120c08">
<title>Royal Chess 3D</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c"></canvas></div>

  <div id="loading"><div class="ld-title">ROYAL CHESS <b>3D</b></div><div class="ld-bar"><i></i></div><div class="ld-sub">Carving the pieces…</div></div>

  <!-- HOME -->
  <div id="home" class="screen hidden">
    <div class="home-top">
      <div class="chip" id="homeCoins">🪙 <b>0</b></div>
      <div class="chip rating" id="homeRating">♔ <b>800</b></div>
      <button class="icon" id="btnSettings" aria-label="Settings">⚙</button>
    </div>
    <div class="logo"><span class="l1">ROYAL</span><span class="l2">CHESS</span><span class="l3">3D</span></div>
    <div class="tagline">Horse · Elephant · Camel · King</div>
    <div class="home-bottom">
      <button class="btn gold big" id="btnContinue">▶ Continue game</button>
      <button class="btn gold big" id="btnAI">♞ Play vs Computer</button>
      <div class="row2"><button class="btn dark big" id="btnPvP">♟ Pass &amp; Play</button><button class="btn dark big" id="btnPuz">🧩 Puzzles<em id="dotPuz" class="dot hidden">!</em></button></div>
      <div class="home-row">
        <button class="tile" id="btnGift"><i>🎁</i>Daily<em id="dotGift" class="dot hidden">!</em></button>
        <button class="tile" id="btnShop"><i>🛍</i>Shop</button>
        <button class="tile" id="btnStats"><i>📊</i>Stats</button>
        <button class="tile" id="btnHow"><i>❓</i>Help</button>
      </div>
    </div>
  </div>

  <!-- IN-GAME HUD -->
  <div id="hud" class="hidden">
    <div class="bar top" id="barTop">
      <div class="avatar" id="avTop">♚</div>
      <div class="who"><b id="nameTop">Computer</b><div class="caps" id="capTop"></div></div>
      <div class="clock" id="clockTop"></div>
    </div>
    <div class="subrow"><div class="turn w" id="turn"></div><div class="movestrip" id="moves"></div></div>
    <div class="pinfo hidden" id="pinfo"></div>
    <div class="think hidden" id="think"><span></span><span></span><span></span> thinking</div>
    <div class="bar bottom" id="barBot">
      <div class="avatar" id="avBot">♔</div>
      <div class="who"><b id="nameBot">You</b><div class="caps" id="capBot"></div></div>
      <div class="clock" id="clockBot"></div>
    </div>
    <div class="dock">
      <button class="dk" id="btnUndo"><i>↶</i><span>Undo</span><b id="nUndo">3</b></button>
      <button class="dk" id="btnHint"><i>💡</i><span>Hint</span><b id="nHint">3</b></button>
      <button class="dk" id="btnView"><i>⟲</i><span>View</span></button>
      <button class="dk" id="btnMenu"><i>☰</i><span>Menu</span></button>
    </div>
  </div>

  <div id="toast"></div>
  <div id="modal" class="overlay hidden"><div class="card" id="card"></div></div>
</div>
<script src="js/chess-engine.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
